services:
  mysql:
    image: mysql:8.0
    container_name: crm_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: crm_integrador
      MYSQL_USER: crm
      MYSQL_PASSWORD: crm123
    ports:
      - "3307:3306"
    volumes:
      - crm_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  api:
    build: .
    container_name: crm_api
    restart: unless-stopped
    ports:
      - "3333:3333"
    environment:
      PORT: 3333
      DATABASE_URL: mysql://crm:crm123@mysql:3306/crm_integrador
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  crm_mysql_data:
